# This is the yaml file for CARP snakemake pipeline
# Before running the snakemake pipeline, make sure you set up yaml file
# 2026-10-14
# Version 1

###################
# I/O Directories #
###################

# =========== Input & output directory =================
input_dir: "data"
output_dir: "output"

# =========== Input genome name =================
# Sample prefixes matching FASTA files under data/
# Example
# If your input file is data/test_input.fa
# You need to put
# preFix:
#   - test_input
preFix:
  - test_input

###################################
# Reference libraries directories #
###################################
# Reference libraries
repbase_library: "lib/Vertebrates_RepBase31.09.fa"
our_known_library: "lib/our_known_reps_20130520.fasta"
swissprot_library: "lib/24-05-12.uniprot_sprot.fasta"
gb_te_library: "lib/GB_TE.2022-07-14.fa"
retrovirus_library: "lib/all_retrovirus.fasta"

###########################
# Computational resources #
###########################

# Maximum threads used by multithreaded tools
max_threads: 24

###################
# CARP parameters #
###################

# ========== Bundle ==========================================
# Maximum number of bases in each bundled genome FASTA
bundle_size: 3000000


# ========== Krishna ==========================================
# Minimum alignment identity as a proportion from 0 to 1
krishna_filter_identity: 0.94
# Minimum alignment length in bases
krishna_filter_length: 400

# ========== Seqer ============================================
# Maximum number of members used for one repeat family
seqer_max_family_size: 100
# Minimum retained sequence length as a proportion from 0 to 1
seqer_min_length: 0.95

# ========== INS ==============================================
# Soft-mask RepBase matches before searching the our-known library
repeats_in_repbase_first_softmask: false

####################
# Optional outputs #
####################
# ========= Enable rule annotate_genome =======================
# Enable rule annotate_genome
annotate_genome: false
# Soft-mask matches before searching the Denovo TE library
annotate_genome_first_softmask: false
# ========= Enable rule plot_ins_map ==========================
plot_ins_map: false
# Keep an empty list when plot_ins_map is false
plot_consensus_ids: []
# If you want to generate annotation png files for selected consensu
# First enable plot_ins_map
# plot_ins_map: true
# Then, list the consensus you select
# NB: Consensus must exactly match the first field of FASTA headers
# plot_consensus_ids:
#   - family000001_consensus
#   - family000007_consensus
#   - family000025_consensus
# ========= Enable rule make_report ===========================
# Generate the final interactive html report
make_report: false



